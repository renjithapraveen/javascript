<!DOCTYPE html>
<html lang="en">

<head>
    <title>Modren Simple Website</title>
    <style>
        body {
            margin: 0;
            font-family: "segoe UI , Tohama , Genva, Verdana , sans-serif";
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(90deg, #4caf50, #2e7d32);
            color: white;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #FFD700;
        }

        main {
            flex: 1;
            padding: 40px 20px;
            background: #81aacb;
            text-align: center;
        }

        main h2 {
            color: #333;
            margin-bottom: 15px;
        }

        main p {
            color: #555;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        footer a {
            color: #4CAF50;
            text-decoration: none;
            margin: 0 8px;
            transition: color 0.3s;
            align-content: center;
        }

        footer a:hover {
            color: #FFD700;
        }
    </style>
</head>

<body>
    <h2>My Stylish Website</h2>
    <header>
    <nav>
        <a href="#">home</a>
        <a href="#">About</a>
        <a href="#">Service</a>
        <a href="#">Contact</a>
    </nav>
    </header>
    <main>
        <h2>Welcome To My Website</h2>
        <p>
            this is a modren styled page with a header,navigation,content section, and a nice footer
            u can add more and make it your own!

        </p>
    </main>
    <footer>
        <p>&copy; 2025 My Stylish Website designed with heart</p>
        <a href="#">privacy policy</a>
        <a href="#">terms</a>
        <a href="#">Contact</a>
    </footer>
</body>

</html>
