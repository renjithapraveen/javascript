<!DOCTYPE html>
<html>
<head>
   <title>Hero Section Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #1e1e1e;
      color: white;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 70vh;
      background-image: url("cake.jpeg"); 
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-text {
      position: relative;
      font-size: 2.5rem;
      letter-spacing: 4px;
      color: white;
      text-transform: uppercase;
    }

    .section-two {
      background-color: #222;
      padding: 60px 20px;
      text-align: center;
    }

    .section-two h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .section-two p {
      max-width: 700px;
      margin: auto;
      font-size: 1rem;
      line-height: 1.6;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-text">CAKES LET'S HAVE IT</div>
  </div>

  <div class="section-two">
    <h2>Section Two</h2>
    <p>
      Web development is the work involved in developing a Web site for the Internet (World Wide Web) or an intranet (a private network).
    </p>
  </div>

</body>
</html>
