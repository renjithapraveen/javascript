<!DOCTYPE html>
<html>
<head>
       <title>Navigation</title>


    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #121212;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .navigation {
            padding-top: 20px;
        }

        .row {
            display: flex;
            align-items: center;
        }

        .col-6 {
            width: 50%;
        }

        .text-center {
            text-align: center;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
        }

        .nav-row div {
            width: 25%;
        }

        .navigation-link {
            text-decoration: none;
            color: white;
            font-size: 16px;
            text-transform: capitalize;
        }

        .navigation-link:hover {
            color: #00bcd4;
        }
    </style>
</head>

<body>
    <div class="container navigation">
        <div class="row">
            <div class="col-6">
                <h5 class="white">My Website</h5>
            </div>

            <div class="col-6">
                <div class="nav-row text-center">
                    <div>
                        <a href="about.html" class="navigation-link">about</a>
                    </div>
                    <div>
                        <a href="project.html" class="navigation-link">project</a>
                    </div>
                    <div>
                        <a href="#social-media" class="navigation-link">social media</a>
                    </div>
                    <div>
                        <a href="#resume" class="navigation-link">resume</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
