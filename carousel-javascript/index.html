<!DOCTYPE html>
<html lang="en">

<head>
        <title>Simple Carousel</title>
</head>

<body>
    <h1>my favorite Places</h1>

    <div class="carousel-container">
        <img class="myslides" src="https://picsum.photos/id/1040/800/400" height="300" width="300" alt="Slide 1">
        <img class="myslides" src="https://picsum.photos/id/1025/800/400" height="300" width="300" alt="Slide 2">
        <img class="myslides" src="https://picsum.photos/id/1018/800/400" height="300" width="300" alt="Slide 3">
    </div>

    <script>
        var index = 0;
            function carousel() {
                var i;
                var x = document.getElementsByClassName("myslides");

                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                index++;
                if (index > x.length) {
                    index = 1;
                }
                x[index - 1].style.display = "block";
                setTimeout(carousel, 2000);
            }
            carousel(); // Start the carousel when the page loads

    </script>
</body>

</html>
